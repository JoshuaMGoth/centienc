<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ¢entien¢</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/centienc-logo.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Login — ¢entien¢">
<meta property="og:description" content="Sign in to your ¢entien¢ monitoring dashboard.">
<meta property="og:image" content="/static/centienc-og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Login — ¢entien¢">
<meta name="twitter:description" content="Sign in to your ¢entien¢ monitoring dashboard.">
<meta name="twitter:image" content="/static/centienc-og.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}

.login-box{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:42px 40px;width:380px;max-width:95vw;box-shadow:0 12px 50px rgba(0,0,0,.4);backdrop-filter:blur(14px);text-align:center}
.login-box .logo{width:60px;height:60px;border-radius:14px;object-fit:cover;display:block;margin:0 auto 16px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.login-box h1{font-size:1.5em;font-weight:700;text-shadow:1px 1px 4px rgba(0,0,0,.5);margin-bottom:4px}
.login-box .sub{font-size:.82em;color:rgba(255,255,255,.55);margin-bottom:26px}

label{display:block;text-align:left;font-size:.72em;color:rgba(255,255,255,.5);margin-bottom:4px;margin-top:14px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;padding:11px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;color:#fff;font-size:.9em;outline:none;transition:.2s}
input:focus{border-color:#64b5f6;background:rgba(255,255,255,.13)}
input::placeholder{color:rgba(255,255,255,.3)}

.btn{width:100%;margin-top:22px;padding:12px;border-radius:9px;border:none;background:linear-gradient(135deg,#1e88e5,#1565c0);color:#fff;font-size:.95em;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.02em;box-shadow:0 4px 16px rgba(30,136,229,.4)}
.btn:hover{background:linear-gradient(135deg,#1976d2,#0d47a1);box-shadow:0 6px 20px rgba(30,136,229,.55)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.err{color:#ff6b6b;font-size:.78em;margin-top:10px;min-height:18px;text-align:left}
</style>
</head>
<body>
<div class="login-box">
  <img class="logo" src="/static/centienc-logo.png" alt="¢entien¢ logo">
  <h1>¢entien¢</h1>
  <div class="sub">Sign in to your monitoring dashboard</div>
  <form onsubmit="doLogin(event)">
    <label>Username</label>
    <input id="username" placeholder="admin" autocomplete="username" autofocus>
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" type="submit" id="loginBtn">Sign In</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Signing in…';
  document.getElementById('loginErr').textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Login failed');
    location.href='/';
  }catch(err){
    document.getElementById('loginErr').textContent=err.message;
    btn.disabled=false;btn.textContent='Sign In';
  }
}
</script>
</body>
</html>
