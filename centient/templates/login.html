<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ¢entient¢</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent2:#388bfd;--green:#3fb950;--red:#f85149;--radius:10px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center}

.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px;width:380px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.4);text-align:center}
.login-box .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;margin:0 auto 16px}
.login-box h1{font-size:20px;margin-bottom:4px}
.login-box .sub{font-size:13px;color:var(--text2);margin-bottom:24px}

label{display:block;text-align:left;font-size:12px;color:var(--text2);margin-bottom:4px;margin-top:14px}
input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--accent)}

.btn{width:100%;margin-top:20px;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.err{color:var(--red);font-size:12px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">S</div>
  <h1>¢entient¢</h1>
  <div class="sub">Sign in to your monitoring dashboard</div>
  <form onsubmit="doLogin(event)">
    <label>Username</label>
    <input id="username" autocomplete="username" autofocus>
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="btn" type="submit" id="loginBtn">Sign In</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Signing in…';
  document.getElementById('loginErr').textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Login failed');
    location.href='/';
  }catch(err){
    document.getElementById('loginErr').textContent=err.message;
    btn.disabled=false;btn.textContent='Sign In';
  }
}
</script>
</body>
</html>
