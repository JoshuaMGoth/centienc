<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentienC — Reports</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/centienc-logo.png">
<meta property="og:type" content="website">
<meta property="og:title" content="CentienC — Reports">
<meta property="og:description" content="Comprehensive uptime, traffic, and security reports.">
<meta property="og:image" content="/static/centienc-og.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--surface:#0f1923;--surface2:#162032;--surface3:#1c2a3f;
  --border:rgba(255,255,255,.07);--text:#e6edf3;--text2:#8b949e;--text3:#58748a;
  --blue:#58a6ff;--green:#3fb950;--orange:#ffa726;--red:#f85149;
  --purple:#ab47bc;--teal:#26c6da;--yellow:#d29922;
}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:50}
.header h1{font-size:1.05em;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
.header .logo{width:28px;height:28px;border-radius:6px;object-fit:cover}
.header-sub{color:rgba(255,255,255,.4);font-weight:300;font-size:.9em}
.header-links{display:flex;gap:6px;flex-wrap:wrap}
.header-links a{color:var(--text2);text-decoration:none;font-size:.82em;padding:4px 11px;
  border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.03);transition:.15s;white-space:nowrap}
.header-links a:hover,.header-links a.active{color:var(--blue);border-color:rgba(88,166,255,.35);background:rgba(88,166,255,.08)}
.controls{background:rgba(0,0,0,.25);border-bottom:1px solid var(--border);padding:10px 24px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.controls label{font-size:.8em;color:var(--text2);margin-right:3px;white-space:nowrap}
.ctl-group{display:flex;align-items:center;gap:6px}
.controls select{border:1px solid rgba(255,255,255,.14);border-radius:8px;background:var(--surface2);
  color:var(--text);padding:6px 12px;font-size:.84em;cursor:pointer;outline:none;transition:.15s}
.controls select:hover{border-color:rgba(88,166,255,.4)}
.controls select option{background:#0d1117;color:var(--text)}
.pill-row{display:flex;gap:5px}
.pill{border:1px solid var(--border);border-radius:20px;background:rgba(255,255,255,.04);
  color:var(--text2);padding:4px 14px;font-size:.8em;cursor:pointer;transition:.15s;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.07)}
.pill.active{background:rgba(88,166,255,.2);border-color:rgba(88,166,255,.5);color:#fff;font-weight:600}
.refresh-btn{border:1px solid rgba(88,166,255,.35);border-radius:8px;background:rgba(88,166,255,.12);
  color:var(--blue);padding:6px 14px;font-size:.83em;cursor:pointer;transition:.15s;white-space:nowrap}
.refresh-btn:hover{background:rgba(88,166,255,.25)}
.export-btns{display:flex;gap:5px;margin-left:auto}
.export-btn{border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.03);
  color:var(--text2);padding:5px 12px;font-size:.8em;cursor:pointer;transition:.15s;text-decoration:none;white-space:nowrap}
.export-btn:hover{background:rgba(102,187,106,.12);border-color:rgba(102,187,106,.35);color:var(--green)}
#lastUpdated{font-size:.76em;color:var(--text3);white-space:nowrap}
.state-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;gap:14px}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.25);border-radius:12px;
  padding:20px 24px;max-width:500px;text-align:center;color:#ff8a80;line-height:1.6;font-size:.88em}
.page{max-width:1500px;margin:0 auto;padding:20px 22px 80px}
.slabel{font-size:.7em;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text3);
  margin-bottom:10px;margin-top:28px;padding-bottom:6px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:4px}
.kpi-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px;transition:.15s}
.kpi:hover{border-color:rgba(88,166,255,.25);transform:translateY(-2px)}
.kpi-label{font-size:.68em;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.kpi-val{font-size:1.9em;font-weight:700;line-height:1}
.kpi-sub{font-size:.7em;color:var(--text3);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.card h3{font-size:.9em;font-weight:600;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-wrap{position:relative;height:260px}
.chart-wrap-sm{position:relative;height:180px}
.sla-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:.74em;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.sla-aplus{background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.sla-a{background:rgba(63,185,80,.1);color:#66bb6a;border:1px solid rgba(63,185,80,.2)}
.sla-b{background:rgba(255,202,40,.12);color:#ffc107;border:1px solid rgba(255,202,40,.25)}
.sla-c{background:rgba(255,167,38,.12);color:var(--orange);border:1px solid rgba(255,167,38,.25)}
.sla-fail{background:rgba(248,81,73,.1);color:var(--red);border:1px solid rgba(248,81,73,.25)}
.grade-wrap{display:inline-flex;width:38px;height:38px;border-radius:9px;align-items:center;
  justify-content:center;font-weight:900;font-size:1.1em}
.uptime-bar{width:100%;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.uptime-fill{height:100%;border-radius:4px;transition:width .5s ease}
.status-grid-wrap{overflow-x:auto;padding-bottom:4px}
.status-grid{display:flex;gap:3px;flex-wrap:wrap}
.sg-day{width:14px;height:14px;border-radius:3px;cursor:default;transition:.1s;flex-shrink:0}
.sg-day:hover{outline:1px solid rgba(255,255,255,.5);z-index:2;transform:scale(1.25)}
.sg-legend{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.7em;color:var(--text3)}
.sg-legend-item{display:flex;align-items:center;gap:4px}
.sg-legend-dot{width:12px;height:12px;border-radius:3px}
.sg-summary{font-size:.75em;color:var(--text2);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.rtbl{width:100%;border-collapse:collapse;font-size:.84em}
.rtbl thead th{color:var(--text3);font-weight:600;text-transform:uppercase;font-size:.69em;
  letter-spacing:.05em;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.rtbl tbody tr{transition:.1s}
.rtbl tbody tr:hover td{background:rgba(255,255,255,.03)}
.rtbl tbody tr.clickable{cursor:pointer}
.rtbl tbody tr.clickable:hover td{background:rgba(88,166,255,.05)}
.rtbl td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.rtbl td.rank{color:var(--text3);font-size:.78em;width:28px;text-align:center}
.rtbl-name{font-weight:500}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:.88em}
.nodata{color:var(--text3);font-size:.83em;padding:20px;text-align:center}
.badge{display:inline-block;padding:2px 9px;border-radius:14px;font-size:.76em;font-weight:600;white-space:nowrap}
.badge-up{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.25)}
.badge-down{background:rgba(248,81,73,.1);color:var(--red);border:1px solid rgba(248,81,73,.25)}
.badge-open{background:rgba(255,167,38,.12);color:var(--orange);border:1px solid rgba(255,167,38,.25)}
.badge-resolved{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.2)}
.badge-type{background:rgba(88,166,255,.1);color:var(--blue);border:1px solid rgba(88,166,255,.2);
  font-size:.7em;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.traffic-section{background:var(--surface2);border:1px solid rgba(88,166,255,.15);
  border-radius:12px;padding:18px;margin-top:0}
.traffic-loading{color:var(--text3);font-size:.83em;padding:14px 0;text-align:center}
.traffic-mini-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tmk{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center}
.tmk-val{font-size:1.4em;font-weight:700}
.tmk-lbl{font-size:.67em;color:var(--text3);margin-top:3px;text-transform:uppercase}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--blue);text-decoration:none;
  font-size:.85em;padding:4px 0;margin-bottom:14px;transition:.15s}
.back-link:hover{color:#fff}
.insight-strip{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0}
.insight{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:.82em}
.insight-icon{font-size:1.3em}
.insight-body{display:flex;flex-direction:column;gap:2px}
.insight-val{font-weight:700}
.insight-lbl{color:var(--text3);font-size:.88em}
.settings-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);
  margin-top:20px;font-size:.8em;color:var(--text3);flex-wrap:wrap}
.settings-row input[type=number]{width:64px;border:1px solid rgba(255,255,255,.15);border-radius:6px;
  background:var(--surface2);color:var(--text);padding:3px 8px;font-size:.9em;outline:none}
.save-btn{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);color:var(--green);
  border-radius:7px;padding:4px 12px;cursor:pointer;font-size:.85em;transition:.15s}
.save-btn:hover{background:rgba(63,185,80,.25)}
.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-orange{color:var(--orange)}
.c-red{color:var(--red)}.c-purple{color:var(--purple)}.c-teal{color:var(--teal)}
.c-text2{color:var(--text2)}.c-text3{color:var(--text3)}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:700px){
  .header-links{display:none}.kpi-grid,.kpi-grid-4{grid-template-columns:repeat(2,1fr)}
  .page{padding:14px 14px 80px}.controls{flex-direction:column;align-items:flex-start}
  .export-btns{margin-left:0}.kpi-val{font-size:1.5em}
}
</style>
</head>
<body>

<div class="header">
  <h1>
    <img src="/static/centienc-logo.png" alt="CentienC" class="logo" onerror="this.style.display='none'">
    <span>CentienC</span>
    <span class="header-sub">/ Reports</span>
  </h1>
  <div class="header-links">
    <a href="/">🏠 Dashboard</a>
    <a href="/map">🗺️ Map</a>
    <a href="/tv">📺 TV</a>
    <a href="/analytics">📊 Analytics</a>
    <a href="/reports" class="active">📋 Reports</a>
    <a href="/troubleshoot">🛠️ Troubleshoot</a>
    <a href="/updates">📣 Updates</a>
    <a href="/admin">⚙️ Admin</a>
  </div>
</div>

<div class="controls">
  <div class="ctl-group">
    <label for="reportType">📋 Report:</label>
    <select id="reportType">
      <option value="overview">📊 Overview</option>
      <option value="server">🖥️ Servers</option>
      <option value="website">🌐 Websites</option>
      <option value="service">⚙️ Services</option>
      <option value="incidents">🚨 Incidents</option>
      <option value="bans">🛡️ Security / Fail2Ban</option>
    </select>
  </div>
  <div class="ctl-group" id="targetFilterWrap" style="display:none">
    <label for="targetFilter">📌 Target:</label>
    <select id="targetFilter"><option value="">All</option></select>
  </div>
  <div class="ctl-group">
    <label>Period:</label>
    <div class="pill-row" id="daysPills">
      <span class="pill" data-days="1">24h</span>
      <span class="pill active" data-days="7">7d</span>
      <span class="pill" data-days="14">14d</span>
      <span class="pill" data-days="30">30d</span>
      <span class="pill" data-days="90">90d</span>
    </div>
  </div>
  <button class="refresh-btn" onclick="loadReport()">↻ Refresh</button>
  <div class="export-btns">
    <a class="export-btn" onclick="exportReport('csv')">📄 CSV</a>
    <a class="export-btn" onclick="exportReport('html')">🌐 HTML</a>
    <a class="export-btn" onclick="exportReport('pdf')">📑 PDF</a>
  </div>
  <span id="lastUpdated"></span>
</div>

<div id="mainContent">
  <div class="state-overlay">
    <div class="spinner"></div>
    <span style="color:var(--text3)">Loading report…</span>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
let charts = {}, activeDays = 7;
let targets = { server:[], website:[], service:[] };
let currentDetail = null;

// ── Utilities ──────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function fmt(n){ n=Math.round(n||0); return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n) }
function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); charts={} }
function formatDuration(sec){
  if(!sec && sec!==0) return '—';
  const s=Math.floor(sec);
  if(s<60) return s+'s';
  const m=Math.floor(s/60), r=s%60;
  if(m<60) return m+'m'+(r?' '+r+'s':'');
  const h=Math.floor(m/60), rm=m%60;
  return h+'h'+(rm?' '+rm+'m':'');
}
function uptimeColor(p){
  return p>=99.9?'#3fb950':p>=99?'#66bb6a':p>=95?'#ffa726':p>=90?'#ff7043':'#f85149';
}

// ── SLA Compliance ─────────────────────────────────────────────
function calcSLA(pct, days){
  const downMin = (1-pct/100)*days*1440;
  const tiers = [
    {label:'99.9% SLA',thr:99.9,cls:'sla-aplus'},
    {label:'99.5% SLA',thr:99.5,cls:'sla-a'},
    {label:'99% SLA',  thr:99.0,cls:'sla-b'},
    {label:'95% SLA',  thr:95.0,cls:'sla-c'},
  ];
  const t = tiers.find(t=>pct>=t.thr)||{label:'Below 95%',cls:'sla-fail'};
  return {tier:t.label, cls:t.cls, downtimeMin:Math.round(downMin)};
}
function slaHTML(pct, days){ const s=calcSLA(pct,days); return `<span class="sla-badge ${s.cls}">✓ ${esc(s.tier)}</span>`; }

// ── Reliability Grade ──────────────────────────────────────────
function reliabilityGrade(p){
  if(p>=99.9) return {grade:'A+',color:'#3fb950'};
  if(p>=99.5) return {grade:'A', color:'#66bb6a'};
  if(p>=99.0) return {grade:'B', color:'#ffc107'};
  if(p>=95.0) return {grade:'C', color:'#ffa726'};
  if(p>=90.0) return {grade:'D', color:'#ff7043'};
  return {grade:'F',color:'#f85149'};
}

// ── MTTR ───────────────────────────────────────────────────────
function calcMTTR(inc){
  const res = (inc||[]).filter(i=>i.status==='resolved'&&i.duration>0);
  return res.length ? Math.round(res.reduce((s,i)=>s+i.duration,0)/res.length) : null;
}

// ── Status History Grid ────────────────────────────────────────
function buildStatusGrid(daily_data, days){
  const map={};
  (daily_data||[]).forEach(d=>{ const k=d.date||d.day; if(k) map[k]=d.uptime_pct; });
  const today=new Date(), dots=[];
  for(let i=days-1;i>=0;i--){
    const dt=new Date(today); dt.setDate(dt.getDate()-i);
    const key=dt.toISOString().slice(0,10);
    dots.push({key, pct:map[key]});
  }
  function dotCol(p){
    if(p===undefined||p===null) return 'rgba(255,255,255,.06)';
    if(p>=99.9) return '#3fb950';
    if(p>=99)   return '#66bb6a';
    if(p>=95)   return '#ffa726';
    if(p>=90)   return '#ff7043';
    return '#f85149';
  }
  const pf=dots.filter(d=>d.pct===100).length;
  const pd=dots.filter(d=>d.pct!==undefined&&d.pct<100).length;
  const pn=dots.filter(d=>d.pct===undefined).length;
  let html='<div class="status-grid">';
  dots.forEach(d=>{
    const tip = d.pct!==undefined ? `${d.key}: ${d.pct.toFixed(1)}% uptime` : `${d.key}: no data`;
    html += `<div class="sg-day" style="background:${dotCol(d.pct)}" title="${esc(tip)}"></div>`;
  });
  html += '</div>';
  html += '<div class="sg-legend">'
    +'<div class="sg-legend-item"><div class="sg-legend-dot" style="background:#3fb950"></div> 100%</div>'
    +'<div class="sg-legend-item"><div class="sg-legend-dot" style="background:#66bb6a"></div> ≥99%</div>'
    +'<div class="sg-legend-item"><div class="sg-legend-dot" style="background:#ffa726"></div> ≥95%</div>'
    +'<div class="sg-legend-item"><div class="sg-legend-dot" style="background:#f85149"></div> &lt;95%</div>'
    +'<div class="sg-legend-item"><div class="sg-legend-dot" style="background:rgba(255,255,255,.06)"></div> No data</div>'
    +'</div>';
  html += `<div class="sg-summary"><span>📅 ${days}-day view</span><span>✅ ${pf} perfect days</span>`
    +(pd?`<span>⚠️ ${pd} degraded days</span>`:'')+
    (pn?`<span style="color:var(--text3)">▪ ${pn} no data</span>`:'')+
    '</div>';
  return html;
}

// ── Loading / Error ────────────────────────────────────────────
function showLoading(msg){
  destroyCharts();
  document.getElementById('mainContent').innerHTML=
    `<div class="state-overlay"><div class="spinner"></div><span style="color:var(--text3)">${esc(msg||'Loading…')}</span></div>`;
}
function showError(msg){
  destroyCharts();
  document.getElementById('mainContent').innerHTML=
    `<div class="state-overlay"><div class="error-box">⚠️ ${esc(msg)}</div></div>`;
}

// ── Load Report ────────────────────────────────────────────────
async function loadReport(){
  currentDetail=null;
  const type=document.getElementById('reportType').value;
  const tid=document.getElementById('targetFilter').value;
  showLoading();
  try{
    let url;
    if(type==='overview') url=`/api/reports/summary?days=${activeDays}`;
    else if(type==='incidents') url=`/api/reports/incidents?days=${activeDays}`;
    else if(type==='bans') url=`/api/reports/bans?days=${activeDays}`;
    else if(tid) url=`/api/reports/detail/${type}/${tid}?days=${activeDays}`;
    else url=`/api/reports/summary?days=${activeDays}`;
    const r=await fetch(url);
    const data=await r.json();
    if(!data.ok) throw new Error(data.detail||'API error');
    if(type==='overview'||(!tid&&['server','website','service'].includes(type))) renderOverview(data);
    else if(type==='incidents') renderIncidents(data);
    else if(type==='bans') renderBans(data);
    else renderDetail(data, type, parseInt(tid), null);
    document.getElementById('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();
  } catch(e){ showError(e.message||'Unknown error'); }
}

// ── Drill into target ──────────────────────────────────────────
async function drillInto(type, id, name){
  currentDetail={type,id,name};
  showLoading('Loading detailed report…');
  try{
    const r=await fetch(`/api/reports/detail/${type}/${id}?days=${activeDays}`);
    const data=await r.json();
    if(!data.ok) throw new Error(data.detail||'API error');
    renderDetail(data, type, id, name);
  } catch(e){ showError(e.message||'Unknown error'); }
}

// ── Render: Overview ──────────────────────────────────────────
function renderOverview(data){
  const t=data.totals||{}, sm=data.summaries||[], inc=data.incidents||[];
  const mttr=calcMTTR(inc);
  const avgUp=t.avg_uptime||100;
  const sla=calcSLA(avgUp,activeDays);

  // Count incidents per target
  const incCounts={};
  inc.forEach(i=>{ const k=`${i.target_type}:${i.target_id}`; incCounts[k]=(incCounts[k]||0)+1; });

  let html=`<div class="page">
  <div class="slabel">📊 Platform Overview — Last ${activeDays} days</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Targets Monitored</div>

// ── Render: Detail ─────────────────────────────────────────────
function renderDetail(data, type, id, name){
  // API returns daily_data / hourly_data / recent_checks (or legacy daily / hourly / timeline)
  const daily   = data.daily_data   || data.daily   || [];
  const hourly  = data.hourly_data  || data.hourly  || [];
  const timeline= data.recent_checks|| data.timeline || [];
  const incidents=data.incidents    || [];
  const totals  = data.totals       || {};

  const tname = name || data.target_name || ('#'+id);
  const totalChecks = totals.total_checks || daily.reduce((a,d)=>a+(d.checks||0),0);
  const uptimePct = totals.uptime_pct ??
    (daily.length ? daily.reduce((a,d)=>a+(d.uptime_pct||0),0)/daily.length : 100);
  const avgResp = totals.avg_response || (()=>{
    const rows=daily.filter(d=>d.avg_response); return rows.length?
      Math.round(rows.reduce((a,d)=>a+d.avg_response,0)/rows.length):null; })();
  const maxResp = totals.max_response || (daily.length?Math.max(...daily.map(d=>d.max_response||0)):0);
  const sla   = calcSLA(uptimePct, activeDays);
  const grade = reliabilityGrade(uptimePct);
  const mttr  = calcMTTR(incidents);
  const openInc=incidents.filter(i=>i.status==='open').length;

  let html=`<div class="page">
  <a class="back-link" href="javascript:void(0)" onclick="currentDetail=null;loadReport()">← Back to overview</a>

    <div>
      <div style="font-size:1.1em;font-weight:700">${esc(tname)}</div>
      <div style="font-size:.8em;color:var(--text3);margin-top:3px">
        <span class="badge-type">${esc(type)}</span>
        &nbsp;${slaHTML(uptimePct,activeDays)}
        &nbsp;— Last ${activeDays} days

    </div>
  </div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Uptime</div>
      <div class="kpi-val" style="color:${uptimeColor(uptimePct)}">${uptimePct.toFixed(2)}%</div>
      <div class="kpi-sub">${sla.downtimeMin} min downtime</div></div>
    <div class="kpi"><div class="kpi-label">Total Checks</div>
      <div class="kpi-val c-blue">${fmt(totalChecks)}</div><div class="kpi-sub">health checks</div></div>
    <div class="kpi"><div class="kpi-label">Avg Response</div>
      <div class="kpi-val c-purple">${avgResp?avgResp+' ms':'—'}</div><div class="kpi-sub">response time</div></div>
    <div class="kpi"><div class="kpi-label">Peak Response</div>
      <div class="kpi-val c-orange">${maxResp?maxResp+' ms':'—'}</div><div class="kpi-sub">worst recorded</div></div>
    <div class="kpi"><div class="kpi-label">Incidents</div>
      <div class="kpi-val ${openInc>0?'c-red':'c-text3'}">${incidents.length}</div>
      <div class="kpi-sub">${openInc} open</div></div>
    <div class="kpi"><div class="kpi-label">MTTR</div>
      <div class="kpi-val c-teal" style="font-size:1.3em">${mttr?formatDuration(mttr):'—'}</div>
      <div class="kpi-sub">mean time to repair</div></div>
  </div>`;

  // Insights
  const ins=[];
  if(sla.downtimeMin>0) ins.push({i:'⏱️',v:sla.downtimeMin+' min',l:'total downtime this period'});
  if(avgResp&&maxResp&&maxResp>avgResp*2) ins.push({i:'📈',v:maxResp+'ms',l:`peak (avg: ${avgResp}ms)`});
  if(mttr) ins.push({i:'🔧',v:formatDuration(mttr),l:'avg time to restore service'});
  if(ins.length){
    html+='<div class="insight-strip">';
    ins.forEach(x=>{ html+=`<div class="insight"><span class="insight-icon">${x.i}</span><div class="insight-body"><div class="insight-val">${esc(x.v)}</div><div class="insight-lbl">${esc(x.l)}</div></div></div>`; });
    html+='</div>';
  }

  if(daily.length){
    html+=`<div class="slabel">📅 ${activeDays}-Day Status History</div>
    <div class="card"><h3><span class="icon">📅</span> Daily Status Grid — hover each square for details</h3>
      <div class="status-grid-wrap">${buildStatusGrid(daily,activeDays)}</div></div>

    <div class="grid-2">
      <div class="card"><h3><span class="icon">📈</span> Daily Uptime %</h3>
        <div class="chart-wrap"><canvas id="chartDailyUptime"></canvas></div></div>

        <div class="chart-wrap"><canvas id="chartDailyResp"></canvas></div></div>

    <div class="card"><h3><span class="icon">🕐</span> Avg Response Time by Hour of Day</h3>
      <div class="chart-wrap"><canvas id="chartHourly"></canvas></div></div>`;

  if(type==='website'){
    html+=`<div class="slabel">📊 Web Traffic Analytics</div>
    <div class="traffic-section">
      <div class="traffic-loading" id="trafficLoading">⏳ Loading traffic analytics…</div>
      <div id="trafficContent" style="display:none"></div>
    </div>`;
  }

  if(daily.length){
    html+=`<div class="slabel">📋 Daily Breakdown</div>
    <div class="card"><h3><span class="icon">📋</span> Day-by-Day Report</h3>
    <div style="overflow-x:auto">
    <table class="rtbl"><thead><tr>
      <th>Date</th><th style="width:160px">Uptime</th>
      <th>Avg Resp</th><th>Min</th><th>Max</th><th>Checks</th><th>Down</th>

      const cc=uptimeColor(d.uptime_pct||0);

        <td class="mono">${esc(dateKey)}</td>
        <td><div style="display:flex;align-items:center;gap:8px">
          <div class="uptime-bar"><div class="uptime-fill" style="width:${Math.min(100,d.uptime_pct||0)}%;background:${cc}"></div></div>
          <span style="color:${cc};font-weight:600;font-size:.84em;min-width:48px">${(d.uptime_pct||0).toFixed(1)}%</span>
        </div></td>
        <td>${d.avg_response?d.avg_response+' ms':'—'}</td>
        <td>${d.min_response?d.min_response+' ms':'—'}</td>
        <td>${d.max_response?d.max_response+' ms':'—'}</td>
        <td>${fmt(d.checks||0)}</td>
        <td>${dn>0?`<span style="color:var(--red);font-weight:600">${dn}</span>`:'—'}</td>
      </tr>`;
    });
    html+='</tbody></table></div></div>';
  }

  if(timeline.length){
    html+=`<div class="slabel">🕒 Recent Status Timeline</div>
    <div class="card"><h3><span class="icon">🕒</span> Last ${Math.min(timeline.length,50)} Checks</h3>
    <div style="overflow-x:auto">
    <table class="rtbl"><thead><tr><th>Time</th><th>Status</th><th>Response</th></tr></thead><tbody>`;
    timeline.slice(0,50).forEach(t=>{
      const ts=t.timestamp||t.checked_at||'?';
      html+=`<tr>
        <td class="mono">${esc(ts)}</td>

        <td>${t.response_time?t.response_time+' ms':'—'}</td></tr>`;

    html+='</tbody></table></div></div>';

  if(incidents.length){
    html+=`<div class="slabel">🚨 Incidents</div>
    <div class="card"><h3><span class="icon">🚨</span> Incident Log</h3>${incidentTableHTML(incidents,false)}</div>`;

  html+='</div>';
  document.getElementById('mainContent').innerHTML=html;
  if(daily.length) buildDetailCharts(daily);

// ── Website Traffic Enrichment ────────────────────────────────
async function loadWebsiteTraffic(websiteId){
  try{
    const r=await fetch(`/api/analytics?website_id=${encodeURIComponent(websiteId)}&days=${activeDays}`);
    const d=await r.json();
    const tl=document.getElementById('trafficLoading');
    const tc=document.getElementById('trafficContent');
    if(!tl||!tc) return;
    if(!d.ok||d.error||!(d.totals&&d.totals.views)){
      tl.textContent=d.error
        ?'⚠️ Could not load traffic: '+d.error
        :'📊 No traffic data found. Set the log path in Admin to enable analytics.';
      tl.style.color='var(--text3)'; return;
    }
    tl.style.display='none'; tc.style.display='';
    const t=d.totals||{}, devs=d.devices||{}, nvr=d.new_vs_returning||{};
    const hT=(devs.desktop||0)+(devs.mobile||0)+(devs.tablet||0)||1;
    const mobP=Math.round((devs.mobile||0)/hT*100);
    const newP=t.views>0?Math.round((nvr.new||0)/((nvr.new||0)+(nvr.returning||0)||1)*100):0;
    tc.innerHTML=`
    <h3 style="font-size:.9em;font-weight:600;color:var(--teal);margin-bottom:12px">📊 Web Traffic — Last ${activeDays} days</h3>
    <div class="traffic-mini-kpi">
      <div class="tmk"><div class="tmk-val c-blue">${fmt(t.views||0)}</div><div class="tmk-lbl">Pageviews</div></div>
      <div class="tmk"><div class="tmk-val c-green">${fmt(t.unique_visitors||0)}</div><div class="tmk-lbl">Unique IPs</div></div>
      <div class="tmk"><div class="tmk-val c-teal">${mobP}%</div><div class="tmk-lbl">Mobile</div></div>
      <div class="tmk"><div class="tmk-val c-purple">${newP}%</div><div class="tmk-lbl">New Visitors</div></div>
    </div>
    <div class="grid-2" style="gap:10px">
      <div><div style="font-size:.75em;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">Top Pages</div>
        ${topItemsHTML(d.pages||[])}</div>
      <div><div style="font-size:.75em;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">Top Referrers</div>
        ${topItemsHTML(d.referrers||[])}</div>
    </div>
    <div style="margin-top:12px;font-size:.72em;color:var(--text3);text-align:right">
      <a href="/analytics" style="color:var(--blue)">→ Full Analytics page</a>
    </div>`;
  } catch(e){
    const tl=document.getElementById('trafficLoading');
    if(tl){ tl.textContent='⚠️ Traffic data unavailable'; tl.style.color='var(--text3)'; }
  }
}

function topItemsHTML(items){
  if(!items||!items.length) return '<div class="nodata" style="padding:6px 0">No data</div>';
  const max=items[0].count||1;
  let html='<div style="display:flex;flex-direction:column;gap:5px">';
  items.slice(0,6).forEach(p=>{
    const pct=Math.round((p.count||0)/max*100);
    const nm=String(p.name||'?');
    const sh=nm.length>36?'…'+nm.slice(-34):nm;
    html+=`<div style="font-size:.8em">
      <div style="display:flex;justify-content:space-between;margin-bottom:2px">
        <span class="mono" style="color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px" title="${esc(nm)}">${esc(sh)}</span>
        <span style="color:var(--blue);font-weight:600;min-width:36px;text-align:right">${fmt(p.count)}</span>
      </div>
      <div style="height:3px;background:rgba(255,255,255,.06);border-radius:2px">
        <div style="height:100%;width:${pct}%;background:rgba(88,166,255,.5);border-radius:2px"></div>
      </div></div>`;
  });
  return html+'</div>';
}

// ── Render: Incidents ─────────────────────────────────────────
function renderIncidents(data){
  const inc=data.incidents||[];
  const open=inc.filter(i=>i.status==='open').length;
  const res=inc.filter(i=>i.status==='resolved').length;
  const mttr=calcMTTR(inc);
  const durs=inc.filter(i=>i.duration>0).map(i=>i.duration);
  const maxD=durs.length?Math.max(...durs):0, minD=durs.length?Math.min(...durs):0;

  let html=`<div class="page">
  <div class="slabel">🚨 Incidents — Last ${activeDays} days</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Total</div><div class="kpi-val c-orange">${inc.length}</div><div class="kpi-sub">this period</div></div>
    <div class="kpi"><div class="kpi-label">Open</div><div class="kpi-val c-red">${open}</div><div class="kpi-sub">active now</div></div>
    <div class="kpi"><div class="kpi-label">Resolved</div><div class="kpi-val c-green">${res}</div><div class="kpi-sub">closed</div></div>
    <div class="kpi"><div class="kpi-label">MTTR</div><div class="kpi-val c-teal" style="font-size:1.3em">${mttr?formatDuration(mttr):'—'}</div><div class="kpi-sub">mean time to repair</div></div>
    <div class="kpi"><div class="kpi-label">Quickest Fix</div><div class="kpi-val c-green" style="font-size:1.3em">${minD?formatDuration(minD):'—'}</div><div class="kpi-sub">shortest outage</div></div>
    <div class="kpi"><div class="kpi-label">Longest Outage</div><div class="kpi-val c-red" style="font-size:1.3em">${maxD?formatDuration(maxD):'—'}</div><div class="kpi-sub">worst duration</div></div>
  </div>`;

  if(inc.length){
    html+=`<div class="slabel">📊 By Target</div>
    <div class="card" style="margin-bottom:12px">
      <h3><span class="icon">📊</span> Incidents per Target</h3>
      <div class="chart-wrap-sm"><canvas id="chartIncTrend"></canvas></div></div>

    html+='<div class="card"><div class="nodata" style="padding:40px 0">🎉 No incidents in this period — everything is running great!</div></div>';
  }
  html+='</div>';
  document.getElementById('mainContent').innerHTML=html;

}

// ── Render: Bans ──────────────────────────────────────────────
function renderBans(data){
  const bans=data.ban_details||[], f2b=data.fail2ban||{};
  const totB=f2b.total_banned||bans.reduce((a,b)=>a+(b.total_banned||0),0);

  <div class="slabel">🛡️ Security &amp; Fail2Ban</div>

    <div class="kpi"><div class="kpi-label">Currently Active</div><div class="kpi-val c-orange">${fmt(actB)}</div><div class="kpi-sub">blocked right now</div></div>
    <div class="kpi"><div class="kpi-label">Servers Tracked</div><div class="kpi-val c-blue">${bans.length}</div><div class="kpi-sub">with fail2ban data</div></div>
    <div class="kpi"><div class="kpi-label">Protection</div><div class="kpi-val c-green" style="font-size:.95em">${actB>0?'🛡️ Active':'✅ Clean'}</div>
      <div class="kpi-sub">${actB>0?actB+' IPs blocked':'no threats detected'}</div></div>
  </div>`;
  if(bans.length){
    html+=`<div class="slabel">🖥️ Per-Server Breakdown</div>
    <div class="card"><h3><span class="icon">🖥️</span> Fail2Ban by Server</h3>
    <div style="overflow-x:auto"><table class="rtbl">
    <thead><tr><th>Server</th><th>Total Bans</th><th>Active Bans</th><th>Jails</th></tr></thead><tbody>`;
    bans.forEach(b=>{
      html+=`<tr>
        <td class="rtbl-name">${esc(b.server_name)}</td>
        <td><span style="color:var(--red);font-weight:600">${fmt(b.total_banned||0)}</span></td>
        <td>${(b.currently_banned||0)>0?`<span style="color:var(--orange);font-weight:600">${b.currently_banned}</span>`:'—'}</td>
        <td style="color:var(--text3);font-size:.82em">${esc((b.jails||[]).join(', ')||'none')}</td></tr>`;
    });
    html+='</tbody></table></div></div>';
  } else {
    html+='<div class="card"><div class="nodata">No fail2ban data. Install fail2ban on servers to enable security reporting.</div></div>';
  }
  html+='</div>';

}

// ── Incident table ────────────────────────────────────────────
function incidentTableHTML(incidents, showTarget){
  if(!incidents||!incidents.length) return '<div class="nodata">No incidents found.</div>';
  let html='<div style="overflow-x:auto"><table class="rtbl"><thead><tr>';
  if(showTarget) html+='<th>Type</th><th>Target</th>';
  html+='<th>Status</th><th>Started</th><th>Resolved</th><th>Duration</th></tr></thead><tbody>';
  incidents.forEach(inc=>{
    html+='<tr>';
    if(showTarget){
      html+=`<td><span class="badge-type">${esc(inc.target_type)}</span></td>`;
      html+=`<td>${esc(inc.target_name||'#'+inc.target_id)}</td>`;
    }
    html+=`<td><span class="badge ${inc.status==='open'?'badge-open':'badge-resolved'}">${esc(inc.status)}</span></td>`;
    html+=`<td class="mono">${esc(inc.started_at||'—')}</td>`;
    html+=`<td class="mono">${esc(inc.resolved_at||'—')}</td>`;
    const dur=inc.duration;
    html+=`<td>${dur?`<span style="color:${dur>3600?'var(--red)':dur>600?'var(--orange)':'var(--text2)'}">${formatDuration(dur)}</span>`:'⏳ ongoing'}</td>`;
    html+='</tr>';
  });
  return html+'</tbody></table></div>';
}

// ── Charts ─────────────────────────────────────────────────────
const GC='rgba(255,255,255,.05)', TC='rgba(255,255,255,.5)';
Chart.defaults.color=TC; Chart.defaults.borderColor=GC;

function buildOverviewCharts(sm){
  charts.uptime=new Chart(document.getElementById('chartUptime'),{
    type:'bar',
    data:{labels:sm.map(s=>s.name),
      datasets:[{label:'Uptime %',data:sm.map(s=>s.uptime_pct),
        backgroundColor:sm.map(s=>uptimeColor(s.uptime_pct)+'99'),
        borderColor:sm.map(s=>uptimeColor(s.uptime_pct)),borderWidth:1,borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.toFixed(2)+'% uptime'}}},
      scales:{y:{min:85,max:100,ticks:{color:TC,callback:v=>v+'%'},grid:{color:GC}},
              x:{ticks:{color:TC,maxRotation:35},grid:{display:false}}}}
  });
}

function buildDetailCharts(daily){
  charts.dailyUptime=new Chart(document.getElementById('chartDailyUptime'),{
    type:'line',
    data:{labels:daily.map(d=>d.date||d.day),
      datasets:[{label:'Uptime %',data:daily.map(d=>d.uptime_pct||0),
        fill:true,backgroundColor:'rgba(63,185,80,.08)',borderColor:'#3fb950',
        borderWidth:2,tension:.3,pointRadius:2,
        pointBackgroundColor:daily.map(d=>uptimeColor(d.uptime_pct||0))}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{min:80,max:100,ticks:{color:TC,callback:v=>v+'%'},grid:{color:GC}},
              x:{ticks:{color:TC,maxRotation:45,maxTicksLimit:10},grid:{display:false}}}}
  });
  charts.dailyResp=new Chart(document.getElementById('chartDailyResp'),{
    type:'line',
    data:{labels:daily.map(d=>d.date||d.day),
      datasets:[
        {label:'Avg (ms)',data:daily.map(d=>d.avg_response),borderColor:'#58a6ff',tension:.3,pointRadius:2,borderWidth:2},
        {label:'Max (ms)',data:daily.map(d=>d.max_response),borderColor:'rgba(255,167,38,.6)',borderDash:[5,3],tension:.3,pointRadius:0,borderWidth:1.5},
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:TC,boxWidth:12,padding:12}}},
      scales:{y:{ticks:{color:TC,callback:v=>v+'ms'},grid:{color:GC},beginAtZero:true},
              x:{ticks:{color:TC,maxRotation:45,maxTicksLimit:10},grid:{display:false}}}}
  });
}

function buildHourlyChart(hourly){
  const maxR=Math.max(...hourly.map(h=>h.avg_response||0),1);
  charts.hourly=new Chart(document.getElementById('chartHourly'),{
    type:'bar',
    data:{labels:hourly.map(h=>h.hour!=null?h.hour+'h':'?'),
      datasets:[{label:'Avg (ms)',data:hourly.map(h=>h.avg_response||0),
        backgroundColor:hourly.map(h=>{
          const tv=maxR>0?(h.avg_response||0)/maxR:0;
          return `rgba(${Math.round(88+tv*167)},${Math.round(166-tv*100)},${Math.round(255-tv*217)},.65)`;
        }),borderRadius:3,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{ticks:{color:TC,callback:v=>v+'ms'},grid:{color:GC},beginAtZero:true},
              x:{ticks:{color:TC,maxRotation:0},grid:{color:GC}}}}
  });
}

function buildIncidentChart(incidents){
  const cnt={};
  incidents.forEach(i=>{ const k=i.target_name||('#'+i.target_id); cnt[k]=(cnt[k]||0)+1; });
  const lbs=Object.keys(cnt), vs=lbs.map(l=>cnt[l]);
  const pal=['rgba(248,81,73,.75)','rgba(255,167,38,.75)','rgba(88,166,255,.75)',
             'rgba(171,71,188,.75)','rgba(38,198,218,.75)','rgba(102,187,106,.75)'];
  charts.incTrend=new Chart(document.getElementById('chartIncTrend'),{
    type:'bar',
    data:{labels:lbs,datasets:[{label:'Incidents',data:vs,
      backgroundColor:lbs.map((_,i)=>pal[i%pal.length]),borderRadius:5,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{color:TC,stepSize:1},grid:{color:GC}},
              x:{ticks:{color:TC},grid:{display:false}}}}
  });
}

// ── Settings ───────────────────────────────────────────────────
async function loadRetention(){
  try{ const r=await fetch('/api/settings'); const d=await r.json();
    const el=document.getElementById('retentionDays');
    if(d.ok&&d.settings&&el) el.value=d.settings.retention_days||'7'; } catch(e){}
}
async function saveRetention(){
  const val=parseInt(document.getElementById('retentionDays').value);
  if(isNaN(val)||val<1||val>365) return;
  try{ const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({retention_days:String(val)})});
    const d=await r.json();
    const el=document.getElementById('retentionMsg');
    if(el){ el.textContent=d.ok?'Saved ✓':'Error'; setTimeout(()=>el.textContent='',2000); } } catch(e){}
}

// ── Export ─────────────────────────────────────────────────────
function exportReport(format){
  const type=document.getElementById('reportType').value;
  const tid=document.getElementById('targetFilter').value;
  let url=`/api/reports/export?format=${format}&report_type=${type}&days=${activeDays}`;
  if(tid&&['server','website','service'].includes(type)) url+=`&target_type=${type}&target_id=${tid}`;
  if(currentDetail) url=`/api/reports/export?format=${format}&report_type=${currentDetail.type}&days=${activeDays}&target_type=${currentDetail.type}&target_id=${currentDetail.id}`;
  if(format==='pdf') window.open(url+'&autoprint=1','_blank');
  else window.location.href=url;
}

// ── Load targets for filter ───────────────────────────────────
async function loadTargets(){
  try{
    const [sr,wr,svcr]=await Promise.all([
      fetch('/api/servers').then(r=>r.json()),
      fetch('/api/websites').then(r=>r.json()),
      fetch('/api/services').then(r=>r.json()),
    ]);
    targets.server =(sr.servers||[]).map(s=>({id:s.id,name:s.name}));
    targets.website=(wr.websites||[]).map(w=>({id:w.id,name:w.name}));
    targets.service=(svcr.services||[]).map(s=>({id:s.id,name:s.name}));
  } catch(e){}
}
function updateTargetFilter(){
  const type=document.getElementById('reportType').value;
  const wrap=document.getElementById('targetFilterWrap');
  const sel=document.getElementById('targetFilter');
  if(['server','website','service'].includes(type)){
    wrap.style.display='';
    sel.innerHTML='<option value="">All</option>'+
      (targets[type]||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  } else { wrap.style.display='none'; }
}

// ── Events + Boot ─────────────────────────────────────────────
document.getElementById('daysPills').addEventListener('click',e=>{
  const pill=e.target.closest('[data-days]');
  if(!pill) return;
  activeDays=parseInt(pill.dataset.days,10);
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active');
  if(currentDetail) drillInto(currentDetail.type,currentDetail.id,currentDetail.name);
  else loadReport();
});
document.getElementById('reportType').addEventListener('change',()=>{ updateTargetFilter(); loadReport(); });
document.getElementById('targetFilter').addEventListener('change',loadReport);

(async function(){
  await loadTargets();
  updateTargetFilter();
  loadReport();
})();
</script>
