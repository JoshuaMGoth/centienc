<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentienC — Web Analytics</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="shortcut icon" href="/static/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0d1117;color:#fff;min-height:100vh;overflow-x:hidden}

/* ── Header ── */
.header{background:rgba(0,0,0,.4);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(255,255,255,.07)}
.header h1{font-size:1.5em;font-weight:600;text-shadow:none;display:flex;align-items:center;gap:10px}
.header .logo{width:32px;height:32px;border-radius:8px;object-fit:cover;display:block;flex-shrink:0}
.header-right{display:flex;align-items:center;gap:16px;font-size:.82em;color:rgba(255,255,255,.65)}
.header-right a{color:rgba(255,255,255,.65);text-decoration:none;transition:.2s}
.header-right a:hover{color:#58a6ff}
.header-links{display:flex;gap:10px}
.header-links a{background:rgba(255,255,255,.05);padding:4px 12px;border-radius:8px;font-size:.82em;border:1px solid rgba(255,255,255,.07);text-decoration:none;color:rgba(255,255,255,.75);transition:.2s}
.header-links a:hover,.header-links a.active{background:rgba(255,255,255,.07);border-color:rgba(88,166,255,.4);color:#fff}

/* ── Controls bar ── */
.controls{background:rgba(0,0,0,.3);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.04)}
.controls label{font-size:.82em;color:rgba(255,255,255,.55);margin-right:4px}
.controls select,.controls button{border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.05);color:#fff;padding:6px 14px;font-size:.85em;cursor:pointer;outline:none;transition:.2s}
.controls select:hover,.controls button:hover{background:rgba(255,255,255,.07);border-color:rgba(88,166,255,.4)}
.controls select option{background:#0d1117;color:#e6edf3}
.controls .refresh-btn{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.4)}
.controls .refresh-btn:hover{background:rgba(88,166,255,.3)}
.days-pills{display:flex;gap:6px}
.days-pill{border:1px solid rgba(255,255,255,.07);border-radius:20px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.65);padding:4px 14px;font-size:.82em;cursor:pointer;transition:.2s}
.days-pill:hover{background:rgba(255,255,255,.08)}
.days-pill.active{background:rgba(88,166,255,.22);border-color:rgba(88,166,255,.5);color:#fff;font-weight:600}

/* ── Loading / Error ── */
.state-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:16px;opacity:.7}
.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.07);border-top-color:#58a6ff;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(244,67,54,.12);border:1px solid rgba(244,67,54,.3);border-radius:12px;padding:20px 28px;max-width:480px;text-align:center;color:#ef9a9a;line-height:1.6}

/* ── Section title ── */
.section-title{padding:4px 24px 8px;max-width:1500px;margin:10px auto 0;color:rgba(255,255,255,.45);font-size:.78em;text-transform:uppercase;letter-spacing:.06em}

/* ── Summary strip ── */
.metrics-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px 24px;max-width:1500px;margin:0 auto}
.mc{background:rgba(255,255,255,.05);border-radius:10px;padding:14px 16px;text-align:center;border:1px solid rgba(255,255,255,.07);transition:transform .2s}
.mc:hover{transform:translateY(-2px)}
.mc-label{font-size:.7em;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.mc-val{font-size:1.9em;font-weight:700}
.mc-sub{font-size:.68em;color:rgba(255,255,255,.4);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-blue{color:#58a6ff}.c-green{color:#66bb6a}.c-orange{color:#ffa726}.c-purple{color:#ab47bc}.c-teal{color:#26c6da}

/* ── Charts grid ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 24px 14px;max-width:1500px;margin:0 auto}
.chart-card{background:rgba(255,255,255,.05);border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,.07)}
.chart-card h3{margin-bottom:14px;color:#58a6ff;font-size:1em;font-weight:600;display:flex;align-items:center;gap:7px}
.chart-card h3 .icon{font-size:1.1em}
.chart-card.full{grid-column:1/-1}
.chart-wrap{position:relative;max-height:280px}
.chart-wrap-tall{position:relative;max-height:340px}

/* ── Tables ── */
.tables-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:0 24px 14px;max-width:1500px;margin:0 auto}
.table-card{background:rgba(255,255,255,.05);border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,.07)}
.table-card h3{margin-bottom:12px;color:#58a6ff;font-size:1em;font-weight:600;display:flex;align-items:center;gap:7px}
.tbl{width:100%;border-collapse:collapse;font-size:.82em}
.tbl th{color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;font-size:.72em;letter-spacing:.04em;padding:4px 6px;text-align:left}
.tbl td{padding:5px 6px;border-top:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.04)}
.tbl .rank{color:rgba(255,255,255,.3);font-size:.8em;width:24px}
.tbl .name{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;font-size:.9em}
.tbl .name-plain{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .count{text-align:right;font-variant-numeric:tabular-nums;color:#58a6ff;font-weight:600}
.bar-mini{height:4px;border-radius:2px;background:rgba(88,166,255,.25);margin-top:3px;overflow:hidden}
.bar-fill{height:100%;background:#58a6ff;border-radius:2px;transition:width .6s ease}

/* ── Device pills ── */
.device-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 24px 24px;max-width:1500px;margin:0 auto}
.dev-pill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:6px 16px;font-size:.82em;display:flex;align-items:center;gap:6px}
.dev-num{font-weight:700;color:#58a6ff}

@media(max-width:1100px){.charts-grid{grid-template-columns:1fr}.tables-grid{grid-template-columns:1fr 1fr}.chart-card.full{grid-column:1}}
@media(max-width:700px){.header{flex-direction:column;gap:8px;text-align:center}.header-links{display:none}.tables-grid{grid-template-columns:1fr}.controls{flex-direction:column;align-items:flex-start}.mc-val{font-size:1.5em}}
</style>
</head>
<body>

<div class="header">
  <h1>
    <img src="/static/centienc-logo.png" alt="logo" class="logo" onerror="this.style.display='none'">
    <span>CentienC</span>
    <span style="font-weight:300;color:rgba(255,255,255,.55)">/ Web Analytics</span>
  </h1>
  <div class="header-right">
    <div class="header-links">
      <a href="/">🏠 Dashboard</a>
      <a href="/map">🗺️ Map</a>
      <a href="/tv">📺 TV</a>
      <a href="/analytics" class="active">📊 Analytics</a>
      <a href="/reports">📋 Reports</a>
      <a href="/troubleshoot">🛠️ Troubleshoot</a>
      <a href="/updates">📣 Updates</a>
      <a href="/admin">⚙️ Admin</a>
    </div>
  </div>
</div>

<div class="controls">
  <div>
    <label for="serverSel">Server:</label>
    <select id="serverSel"><option value="">— loading —</option></select>
  </div>
  <div>
    <label>Period:</label>
    <div class="days-pills" id="daysPills">
      <span class="days-pill" data-days="7">7d</span>
      <span class="days-pill active" data-days="30">30d</span>
      <span class="days-pill" data-days="90">90d</span>
      <span class="days-pill" data-days="180">180d</span>
    </div>
  </div>
  <button class="refresh-btn" onclick="loadAnalytics()">↻ Refresh</button>
  <span id="lastUpdated" style="font-size:.78em;color:rgba(255,255,255,.35);margin-left:auto"></span>
</div>

<div id="mainContent">
  <div class="state-overlay">
    <div class="spinner"></div>
    <span style="color:rgba(255,255,255,.5)">Select a server to load analytics…</span>
  </div>
</div>

<script>
let charts = {};
let activeDays = 30;

// ── Utilities ──────────────────────────────────────────────────
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}

// ── Load server list ───────────────────────────────────────────
async function loadServers(){
  try{
    const r=await fetch('/api/servers');
    const d=await r.json();
    const sel=document.getElementById('serverSel');
    const servers=(d.servers||[]).filter(s=>s.ssh_user);
    if(!servers.length){
      sel.innerHTML='<option value="">No SSH servers configured</option>';
      showError('No SSH-monitored servers found. Add a server with SSH credentials in Admin → Servers.');
      return;
    }
    sel.innerHTML=servers.map(s=>`<option value="${s.id}">${s.name} (${s.hostname||s.ip_address||''})</option>`).join('');
    sel.addEventListener('change',loadAnalytics);
    loadAnalytics();
  }catch(e){
    showError('Could not load servers: '+e.message);
  }
}

// ── Load analytics ─────────────────────────────────────────────
async function loadAnalytics(){
  const sel=document.getElementById('serverSel');
  const srvId=sel.value;
  if(!srvId)return;

  document.getElementById('mainContent').innerHTML=
    `<div class="state-overlay"><div class="spinner"></div><span style="color:rgba(255,255,255,.5)">Reading nginx logs via SSH… this may take a moment for large log files.</span></div>`;
  destroyCharts();

  try{
    const r=await fetch(`/api/analytics?server_id=${srvId}&days=${activeDays}`);
    const d=await r.json();
    if(!d.ok) throw new Error(d.detail||'API error');
    if(d.error) throw new Error(d.error);
    render(d);
    document.getElementById('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){
    showError(e.message||'Unknown error');
  }
}

// ── Error state ────────────────────────────────────────────────
function showError(msg){
  destroyCharts();
  document.getElementById('mainContent').innerHTML=
    `<div class="state-overlay"><div class="error-box">⚠️ ${msg}</div></div>`;
}

// ── Render all data ────────────────────────────────────────────
function render(d){
  const t=d.totals||{};
  const topPage=(d.pages&&d.pages[0])?d.pages[0].name:'—';
  const topTopic=(d.topics&&d.topics[0])?d.topics[0].name:'—';
  const devTotal=(d.devices.mobile||0)+(d.devices.desktop||0)+(d.devices.bot||0)||1;
  const humanTotal=(d.devices.mobile||0)+(d.devices.desktop||0)||1;

  document.getElementById('mainContent').innerHTML=`
  <div class="section-title">Summary</div>
  <div class="metrics-strip">
    <div class="mc"><div class="mc-label">Total Pageviews</div><div class="mc-val c-blue">${fmt(t.views||0)}</div><div class="mc-sub">${activeDays}-day window</div></div>
    <div class="mc"><div class="mc-label">Unique Visitors</div><div class="mc-val c-green">${fmt(t.unique_visitors||0)}</div><div class="mc-sub">unique IPs</div></div>
    <div class="mc"><div class="mc-label">Avg / Day</div><div class="mc-val c-orange">${fmt(t.avg_daily||0)}</div><div class="mc-sub">pageviews per day</div></div>
    <div class="mc"><div class="mc-label">Top Page</div><div class="mc-val" style="font-size:.95em;word-break:break-all;color:#58a6ff">${topPage}</div><div class="mc-sub">${(d.pages&&d.pages[0])?fmt(d.pages[0].count)+' views':''}</div></div>
    <div class="mc"><div class="mc-label">Top Topic</div><div class="mc-val" style="font-size:.95em;word-break:break-all;color:#ab47bc">${topTopic}</div><div class="mc-sub">${(d.topics&&d.topics[0])?fmt(d.topics[0].count)+' views':''}</div></div>
    <div class="mc"><div class="mc-label">Mobile Share</div><div class="mc-val c-teal">${Math.round((d.devices.mobile||0)/humanTotal*100)}%</div><div class="mc-sub">${fmt(d.devices.mobile||0)} mobile visitors</div></div>
  </div>

  <div class="section-title">Traffic Over Time</div>
  <div class="charts-grid">
    <div class="chart-card full"><h3><span class="icon">📈</span> Daily Pageviews (last ${activeDays} days)</h3><div class="chart-wrap-tall"><canvas id="chartTraffic"></canvas></div></div>
  </div>

  <div class="section-title">Pages & Content</div>
  <div class="charts-grid">
    <div class="chart-card"><h3><span class="icon">📄</span> Top Pages</h3><div class="chart-wrap-tall"><canvas id="chartPages"></canvas></div></div>
    <div class="chart-card"><h3><span class="icon">🗂️</span> Site Sections</h3><div class="chart-wrap"><canvas id="chartSections"></canvas></div></div>
  </div>

  <div class="section-title">Health & Sources</div>
  <div class="charts-grid">
    <div class="chart-card"><h3><span class="icon">🔢</span> HTTP Status Codes</h3><div class="chart-wrap"><canvas id="chartStatus"></canvas></div></div>
    <div class="chart-card"><h3><span class="icon">🕐</span> Traffic by Hour of Day</h3><div class="chart-wrap"><canvas id="chartHour"></canvas></div></div>
  </div>

  <div class="section-title">Top Content Topics</div>
  <div class="tables-grid">
    <div class="table-card">
      <h3><span>🏆</span> Focus Topics</h3>
      ${topicsTable(d.topics||[])}
    </div>
    <div class="table-card">
      <h3><span>🔗</span> Top Referrers</h3>
      ${simpleTable(d.referrers||[],'Referrer Domain')}
    </div>
    <div class="table-card">
      <h3><span>🌐</span> Top IP Addresses</h3>
      ${simpleTable(d.top_ips||[],'IP Address')}
    </div>
  </div>

  <div class="section-title">Device Breakdown</div>
  <div class="device-row">
    <div class="dev-pill">💻 Desktop <span class="dev-num">${fmt(d.devices.desktop||0)}</span> <span style="color:rgba(255,255,255,.4);font-size:.85em">${Math.round((d.devices.desktop||0)/humanTotal*100)}%</span></div>
    <div class="dev-pill">📱 Mobile <span class="dev-num">${fmt(d.devices.mobile||0)}</span> <span style="color:rgba(255,255,255,.4);font-size:.85em">${Math.round((d.devices.mobile||0)/humanTotal*100)}%</span></div>
    <div class="dev-pill">🤖 Bots (excluded) <span class="dev-num">${fmt(d.devices.bot||0)}</span></div>
    <div class="dev-pill" style="margin-left:auto;opacity:.5;font-size:.78em">Bots are excluded from all metrics above</div>
  </div>
  `;

  buildCharts(d);
}

// ── Table helpers ──────────────────────────────────────────────
function topicsTable(rows){
  if(!rows.length) return '<p style="color:rgba(255,255,255,.35);font-size:.82em;padding:8px">No data yet</p>';
  const max=rows[0].count||1;
  return `<table class="tbl">
    <tr><th>#</th><th>Topic / Page Slug</th><th style="text-align:right">Views</th></tr>
    ${rows.slice(0,15).map((r,i)=>`
      <tr>
        <td class="rank">${i+1}</td>
        <td><div class="name-plain">${esc(r.name)}</div><div class="bar-mini"><div class="bar-fill" style="width:${Math.round(r.count/max*100)}%"></div></div></td>
        <td class="count">${fmt(r.count)}</td>
      </tr>`).join('')}
  </table>`;
}

function simpleTable(rows, colLabel){
  if(!rows.length) return '<p style="color:rgba(255,255,255,.35);font-size:.82em;padding:8px">No data yet</p>';
  const max=rows[0].count||1;
  return `<table class="tbl">
    <tr><th>#</th><th>${esc(colLabel)}</th><th style="text-align:right">Hits</th></tr>
    ${rows.slice(0,12).map((r,i)=>`
      <tr>
        <td class="rank">${i+1}</td>
        <td><div class="name">${esc(r.name)}</div><div class="bar-mini"><div class="bar-fill" style="width:${Math.round(r.count/max*100)}%"></div></div></td>
        <td class="count">${fmt(r.count)}</td>
      </tr>`).join('')}
  </table>`;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── Build Charts ───────────────────────────────────────────────
function buildCharts(d){
  const gridColor='rgba(255,255,255,.04)';
  const textColor='rgba(255,255,255,.55)';
  Chart.defaults.color=textColor;
  Chart.defaults.borderColor=gridColor;

  // Traffic over time
  const days=d.traffic_by_day||[];
  charts.traffic=new Chart(document.getElementById('chartTraffic'),{
    type:'line',
    data:{
      labels:days.map(x=>x.date),
      datasets:[{
        label:'Pageviews',
        data:days.map(x=>x.count),
        fill:true,
        backgroundColor:'rgba(88,166,255,.12)',
        borderColor:'#58a6ff',
        borderWidth:2,
        pointRadius:days.length>60?0:3,
        pointHoverRadius:5,
        tension:.35,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>'Date: '+items[0].label}}},
      scales:{
        x:{grid:{color:gridColor},ticks:{maxTicksLimit:12,color:textColor}},
        y:{grid:{color:gridColor},ticks:{color:textColor},beginAtZero:true}
      }
    }
  });

  // Top pages horizontal bar
  const pages=(d.pages||[]).slice(0,12);
  charts.pages=new Chart(document.getElementById('chartPages'),{
    type:'bar',
    data:{
      labels:pages.map(p=>p.name.length>35?p.name.slice(0,32)+'…':p.name),
      datasets:[{label:'Views',data:pages.map(p=>p.count),backgroundColor:'rgba(88,166,255,.6)',borderColor:'rgba(88,166,255,.9)',borderWidth:1,borderRadius:4}]
    },
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:gridColor},ticks:{color:textColor},beginAtZero:true},
        y:{grid:{color:'transparent'},ticks:{color:textColor,font:{size:11}}}
      }
    }
  });

  // Sections doughnut
  const secs=(d.sections||[]).slice(0,8);
  const secColors=['#58a6ff','#66bb6a','#ffa726','#ab47bc','#26c6da','#ef5350','#ffca28','#8d6e63'];
  charts.sections=new Chart(document.getElementById('chartSections'),{
    type:'doughnut',
    data:{
      labels:secs.map(s=>s.name),
      datasets:[{data:secs.map(s=>s.count),backgroundColor:secColors.slice(0,secs.length),borderColor:'rgba(0,0,0,.4)',borderWidth:2,hoverOffset:8}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12,color:textColor}}}
    }
  });

  // Status codes doughnut
  const sc=d.status_codes||{};
  const scLabels=Object.keys(sc);
  const scColors={
    '2xx':'rgba(102,187,106,.8)','3xx':'rgba(88,166,255,.8)',
    '4xx':'rgba(255,167,38,.8)','5xx':'rgba(239,83,80,.8)'
  };
  charts.status=new Chart(document.getElementById('chartStatus'),{
    type:'doughnut',
    data:{
      labels:scLabels,
      datasets:[{
        data:scLabels.map(l=>sc[l]),
        backgroundColor:scLabels.map(l=>scColors[l]||'rgba(158,158,158,.7)'),
        borderColor:'rgba(0,0,0,.4)',borderWidth:2,hoverOffset:8
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12,color:textColor}}}
    }
  });

  // Hour of day bar
  const hours=d.traffic_by_hour||Array(24).fill(0);
  charts.hour=new Chart(document.getElementById('chartHour'),{
    type:'bar',
    data:{
      labels:[...Array(24).keys()].map(h=>h+':00'),
      datasets:[{
        label:'Avg Hits',
        data:hours,
        backgroundColor:'rgba(171,71,188,.55)',
        borderColor:'rgba(171,71,188,.85)',
        borderWidth:1,borderRadius:3,
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:gridColor},ticks:{color:textColor,maxRotation:0}},
        y:{grid:{color:gridColor},ticks:{color:textColor},beginAtZero:true}
      }
    }
  });
}

// ── Days pill interaction ──────────────────────────────────────
document.getElementById('daysPills').addEventListener('click',e=>{
  const pill=e.target.closest('[data-days]');
  if(!pill) return;
  activeDays=parseInt(pill.dataset.days,10);
  document.querySelectorAll('.days-pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active');
  loadAnalytics();
});

// ── Boot ──────────────────────────────────────────────────────
loadServers();
</script>
</body>
</html>
